name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharmatrace-vn-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pharmatrace-vn-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Lint without modifying files
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharmatrace-vn-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pharmatrace-vn-frontend/package-lock.json
      - run: npm ci
      - run: node --test src/utils/*.test.mjs
      - run: npm run build
      - run: npm run lint
