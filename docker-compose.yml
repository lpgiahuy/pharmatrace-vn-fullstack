version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: phartrace-vn-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-phartrace-vn-db}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - phartrace_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - pharmatrace-network

volumes:
  phartrace_postgres_data:
    driver: local

networks:
  pharmatrace-network:
    driver: bridge

