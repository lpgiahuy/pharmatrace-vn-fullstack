version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pharmatrace-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-HuyLe@574406}
      POSTGRES_DB: pharmatrace-vn-db
    ports:
      - "5432:5432"
    volumes:
      # Gắn vào volume dữ liệu đã có sẵn từ trước
      - pharma-trace-vn-fullstack_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - pharmatrace-network

volumes:
  pharma-trace-vn-fullstack_postgres_data:
    external: true

networks:
  pharmatrace-network:
    driver: bridge
